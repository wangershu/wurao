[versions]
agp = "9.4.1"
kotlin = "2.4.21"
libxposed = "102.0.0"
junit = "4.13.2"

[libraries]
# LSPosed 新版 API 102（libxposed）。
# 与旧的 de.robv.android.xposed 完全不兼容：没有 XposedHelpers / XposedBridge 可用。
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposed" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposed" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

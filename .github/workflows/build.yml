name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK（/usr/local/lib/android/sdk），
      # 不用 android-actions/setup-android：那个 action 在新版 runner 上会报 "Failed to find package 'tools'"
      - name: Install platform 37 + build-tools
        env:
          SDK: ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "using SDK=$SDK"
          mkdir -p "$SDK/cmdline-tools/latest" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$SDK" > /dev/null 2>&1 || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            --install "platforms;android-37.0" "build-tools;37.0.0"

      # sdkmanager 建出的目录叫 android-37.0，AGP 只认 android-37，补一个软链
      - name: Normalize platform directory name
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            for d in "$SDK"/platforms/android-37.*; do
              [ -d "$d" ] && ln -sfn "$d" "$SDK/platforms/android-37" && break
            done
          fi
          ls "$SDK/platforms"
          echo "sdk.dir=$SDK" >> AdHammerX/local.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x AdHammerX/gradlew

      - name: Assemble debug
        working-directory: AdHammerX
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adhammer-debug
          path: AdHammerX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Release APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK（/usr/local/lib/android/sdk），
      # 不用 android-actions/setup-android：那个 action 在新版 runner 上会报 "Failed to find package 'tools'"
      - name: Install platform 37 + build-tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "using SDK=$SDK"
          mkdir -p "$SDK/cmdline-tools/latest" 2>/dev/null || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses --sdk_root="$SDK" > /dev/null 2>&1 || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            --install "platforms;android-37.0" "build-tools;37.0.0"

      # sdkmanager 建出的目录叫 android-37.0，AGP 只认 android-37，补一个软链
      - name: Normalize platform directory name
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK/platforms/android-37" ]; then
            for d in "$SDK"/platforms/android-37.*; do
              [ -d "$d" ] && ln -sfn "$d" "$SDK/platforms/android-37" && break
            done
          fi
          ls "$SDK/platforms"
          echo "sdk.dir=$SDK" >> AdHammerX/local.properties

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x AdHammerX/gradlew

      # 签名用的 keystore 存在仓库 secrets 里；没配也能构建（退到 debug 签名）
      - name: Decode signing keystore
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KS" ]; then
            echo "SIGNING_KEYSTORE_BASE64 未配置，将使用 debug 签名构建 release"
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/adhammer.jks"

      # 版本号直接跟着 tag 走：v1.2.0 -> versionName=1.2.0，versionCode 用 run_number 保证单调递增。
      # 手动触发时 ref 是分支名，不算版本号，交给 gradle 的默认值。
      - name: Assemble release
        working-directory: AdHammerX
        env:
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_STORE_FILE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && format('{0}/adhammer.jks', runner.temp) || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          case "${GITHUB_REF_NAME:-}" in
            v*) export VERSION_NAME="${GITHUB_REF_NAME#v}" ;;
          esac
          echo "building versionName=${VERSION_NAME:-default} versionCode=$VERSION_CODE"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK + checksum
        run: |
          mkdir -p out
          NAME="adhammer-${GITHUB_REF_NAME:-manual}"
          cp AdHammerX/app/build/outputs/apk/release/app-release.apk "out/$NAME.apk"
          (cd out && sha256sum "$NAME.apk" > "$NAME.apk.sha256")
          cat "out/$NAME.apk.sha256"
          {
            echo "### 发布包校验值"
            echo '```'
            cat "out/$NAME.apk.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: adhammer-release
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # APK + 校验值一起发：下载后可以核对 sha256，确认包没被换过
          files: |
            out/*.apk
            out/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
